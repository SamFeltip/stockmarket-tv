plugins { id 'com.android.application' }
def signingValues = ['STOCKMARKET_KEYSTORE', 'STOCKMARKET_STORE_PASSWORD', 'STOCKMARKET_KEY_ALIAS', 'STOCKMARKET_KEY_PASSWORD'].collectEntries { [(it): System.getenv(it)] }
def hasReleaseSigning = signingValues.values().every { it }
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') } && !hasReleaseSigning) {
    throw new GradleException('Release signing is required. Use npm run android:release; see PUBLISHING.md.')
}
android {
    namespace 'com.stockmarket.tv'
    compileSdk 35
    defaultConfig {
        applicationId 'com.stockmarket.tv'
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName '1.4.0'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(signingValues.STOCKMARKET_KEYSTORE)
                storePassword signingValues.STOCKMARKET_STORE_PASSWORD
                keyAlias signingValues.STOCKMARKET_KEY_ALIAS
                keyPassword signingValues.STOCKMARKET_KEY_PASSWORD
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
// A build without a freshly bundled interface should fail clearly.
tasks.register('verifyWebAssets') {
    doLast {
        if (!file('src/main/assets/web/index.html').exists()) {
            throw new GradleException('Missing TV interface. Run npm run android:sync from stockmarket-tv first.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyWebAssets' }
