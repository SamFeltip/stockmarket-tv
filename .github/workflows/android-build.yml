name: Verify TV Android build

on:
  push:
    branches: [master, codex/shared-game-engine]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_CONVEX_URL: https://effervescent-flamingo-244.convex.cloud
      VITE_PHONE_URL: https://stockmarket.samfelton.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm test
      - name: Build web assets, debug APK and Android lint
        run: npm run android:debug
      - name: Verify that the APK contains every built web asset
        run: |
          python3 - <<'PY'
          import hashlib
          import pathlib
          import zipfile
          apk = pathlib.Path('android/app/build/outputs/apk/debug/app-debug.apk')
          files = [path for path in pathlib.Path('dist').rglob('*') if path.is_file()]
          with zipfile.ZipFile(apk) as archive:
              for path in files:
                  target = 'assets/web/' + path.relative_to('dist').as_posix()
                  assert archive.read(target) == path.read_bytes(), target
          print(f'Verified {len(files)} web assets inside {apk}')
          print('APK SHA-256:', hashlib.sha256(apk.read_bytes()).hexdigest())
          PY
      - name: Prepare downloadable debug APK
        run: |
          mkdir -p prepared
          cp android/app/build/outputs/apk/debug/app-debug.apk prepared/stockmarket-tv-debug.apk
          cd prepared
          sha256sum stockmarket-tv-debug.apk > SHA256SUMS
          printf 'Stockmarket TV debug build\nCommit: %s\nProduction backend: https://effervescent-flamingo-244.convex.cloud\nPhone: https://stockmarket.samfelton.com\nDebug-signed with a CI test key; not a store release.\n' "$GITHUB_SHA" > BUILD.txt
      - name: Upload prepared TV build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stockmarket-tv-debug-${{ github.sha }}
          path: prepared/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
